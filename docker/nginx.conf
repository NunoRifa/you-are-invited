server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Invitation templates are pre-rendered standalone pages.
    # Each /i/<slug> maps to its own static index.html so the ORIGINAL
    # vendor markup and CSS are served byte-for-byte.
    # See CLAUDE.md: "Zero Visual Modification to Templates".
    location /i/ {
        try_files $uri $uri/index.html =404;
    }

    # SPA routes (landing, admin) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Uploaded/template media are static once written.
    location /template-assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
