server {
    listen 80;
    listen 443 ssl http2;
    server_name you-are-invited.my.id www.you-are-invited.my.id localhost;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # SSL Certificates from Let's Encrypt (mounted via Docker volume)
    ssl_certificate /etc/letsencrypt/live/you-are-invited.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/you-are-invited.my.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Enable browser caching for invitation pages (revalidate with ETag)
    location /i/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri $uri/index.html =404;
    }

    # Production subfolder for online client invitations
    location /production/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri $uri/index.html =404;
    }

    # SPA routes (landing, admin) fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Uploaded/template media are static once written.
    location /template-assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
