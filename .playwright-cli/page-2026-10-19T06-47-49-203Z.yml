        - generic [ref=e150]:
          - article [ref=e151]:
            - img "Awal Bertemu"
            - heading "Awal Bertemu" [level=3] [ref=e152]
            - paragraph [ref=e153]: Berawal dari tahun 2015, saat kami masih duduk di bangku SMP. Kedekatan sederhana yang awalnya hanya bercandaan, perlahan tumbuh menjadi kisah cinta yang tak pernah kami sangka akan bertahan hingga dewasa. Sepuluh tahun kami lalui bersama, tumbuh dengan kesibukan dan perjalanan masing-masing, hingga akhirnya kami menyadari bahwa kami ingin terus berjalan berdampingan. Tepat pada 6 Maret 2025, di anniversary ke-10 kami, Ivan mengajak Anggi untuk melangkah ke jenjang yang lebih serius.
          - article [ref=e154]:
            - img "Acara Lamaran"
            - heading "Acara Lamaran" [level=3] [ref=e155]
            - paragraph [ref=e156]: Setelah sepuluh tahun menapaki perjalanan cinta bersama, pada 9 Mei 2026, Ivan dan Anggi mengikat sebuah janji melalui prosesi lamaran. Dengan penuh haru dan bahagia, kami melangkah menuju babak baru, membawa doa, restu keluarga, dan harapan untuk masa depan bersama.
          - article [ref=e157]:
            - img "Acara Pernikahan"
            - heading "Acara Pernikahan" [level=3] [ref=e158]
            - paragraph [ref=e159]: Setelah perjalanan cinta yang panjang, melewati suka dan duka serta tumbuh bersama selama bertahun-tahun, akhirnya kami sampai pada langkah baru yang telah lama dinantikan, yaitu mengikat janji suci pernikahan. Dengan penuh rasa syukur, kami memohon doa restu agar perjalanan baru ini senantiasa diberkahi dan dipenuhi cinta hingga akhir hayat. Kami mengundang keluarga, sahabat, dan orang-orang terkasih untuk hadir serta menjadi bagian dari hari bahagia kami. Kehadiran dan doa restu Anda akan menjadi kebahagiaan yang sangat berarti bagi kami.
