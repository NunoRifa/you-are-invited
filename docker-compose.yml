services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=/app/storage/db/app.sqlite
      # Sourced from a server-side .env (not committed). Set both before deploy.
      - SESSION_SECRET=${SESSION_SECRET}
      # Cloudflare Turnstile — secret stays server-side only.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-true}
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped
