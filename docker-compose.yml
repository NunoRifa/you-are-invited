services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=/app/storage/db/app.sqlite
      # Sourced from a server-side .env (not committed). Set both before deploy.
      - SESSION_SECRET=${SESSION_SECRET}
      # Cloudflare Turnstile — secret stays server-side only.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-true}
    volumes:
      # Named volume — the live database is owned by Docker, not by the repo.
      # This is what prevents a stale git-tracked SQLite file from ever landing
      # next to a fresh, empty database (the cause of SQLITE_CORRUPT).
      - app-storage:/app/storage
    # Bound the restart loop: a permanently-broken DB should surface as a
    # stopped container, not spin forever masking the real error.
    restart: on-failure:5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  app-storage:

